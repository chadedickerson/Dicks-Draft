<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft Lab '26 — Fantasy Football Draft Board</title>
<style>
:root {
  --bg: #0b0e14; --panel: #141926; --panel2: #1a2133; --border: #232b3d;
  --text: #e8ecf4; --muted: #8b95a8; --accent: #4aa8ff; --accent2: #2dd4a7;
  --up: #2dd4a7; --down: #ef4666;
  --qb: #ef4666; --rb: #2dd4a7; --wr: #4aa8ff; --te: #f59e0b; --k: #a78bfa; --dst: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
input:focus, select:focus { outline: 1px solid var(--accent); }
input[type=number] { width: 64px; }

/* Header is sized in viewport units (vw/vh), which do NOT grow with browser
   zoom — zoom in to enlarge the boards for a TV and the menu stays compact. */
header {
  display: flex; align-items: center; gap: .9vw; flex-wrap: wrap;
  padding: .5vh 1vw; background: var(--panel); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 40;
  font-size: max(.72vw, 1.3vh);
}
.logo { font-weight: 800; font-size: max(.9vw, 1.6vh); letter-spacing: .3px; white-space: nowrap; }
.logo span { color: var(--accent); }
.tabs { display: flex; gap: .2vw; background: var(--panel2); border-radius: .4vw; padding: .15vw; }
.tabs button { padding: .35vh .85vw; border-radius: .3vw; color: var(--muted); font-weight: 600; font-size: max(.72vw, 1.3vh); }
.tabs button.on { background: var(--accent); color: #06121f; }
.hbtns { margin-left: auto; display: flex; gap: .45vw; flex-wrap: wrap; }
.hbtns .btn { padding: .35vh .6vw; font-size: max(.72vw, 1.3vh); border-radius: .35vw; }
.livebadge {
  display: inline-flex; align-items: center; padding: .3vh .6vw; border-radius: .35vw;
  font-weight: 800; font-size: max(.66vw, 1.2vh); letter-spacing: .4px;
  background: rgba(45,212,167,.13); color: var(--accent2); border: 1px solid rgba(45,212,167,.4);
}
.livebadge.c { background: rgba(74,168,255,.13); color: var(--accent); border-color: rgba(74,168,255,.4); }
.btn {
  padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--panel2); font-weight: 600; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #06121f; border-color: var(--accent); }
.btn.danger { color: var(--down); }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .4; cursor: default; }

main { padding: 16px 18px 60px; width: 100%; margin: 0 auto; }
.muted { color: var(--muted); }
.mono { font-variant-numeric: tabular-nums; }

/* Board */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.chips { display: flex; gap: 4px; }
.chip { padding: 4px 11px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); font-weight: 600; font-size: 12.5px; }
.chip.on { background: var(--panel2); color: var(--text); border-color: var(--accent); }
.tablewrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: auto; max-height: calc(100vh - 210px); /* refined per-render by fitPanes() */ }
table { border-collapse: collapse; width: 100%; }
th {
  text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
  padding: 9px 10px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); z-index: 5;
  white-space: nowrap; cursor: pointer; user-select: none;
}
th.nosort { cursor: default; }
th .arr { color: var(--accent); }
td { padding: 7px 10px; border-bottom: 1px solid rgba(35,43,61,.55); white-space: nowrap; }
th.statcol, td.statcol { padding-left: 6px; padding-right: 6px; font-size: 12.5px; }
/* sticky rank + player-name columns on the Player Board (horizontal scroll) */
.tablewrap tr:not(.grouprow) th:nth-child(1), .tablewrap td:nth-child(1) {
  position: sticky; left: 0; background: var(--panel); z-index: 2;
  width: 48px; min-width: 48px;
}
.tablewrap tr:not(.grouprow) th:nth-child(2), .tablewrap td:nth-child(2) {
  position: sticky; left: 48px; background: var(--panel); z-index: 2;
  box-shadow: 1px 0 0 var(--border);
}
.tablewrap thead tr:not(.grouprow) th:nth-child(1),
.tablewrap thead tr:not(.grouprow) th:nth-child(2) { z-index: 7; }
.tablewrap tr:hover td:nth-child(1), .tablewrap tr:hover td:nth-child(2) { background: #17202f; }
/* keep sticky cells opaque for drafted (struck-through) rows */
.tablewrap tr.gone td:nth-child(1), .tablewrap tr.gone td:nth-child(2) { opacity: 1; }
.tablewrap tr.gone td:nth-child(2) > * { opacity: .32; }
.tablewrap tr.gone td:nth-child(1) { color: rgba(139,149,168,.35); }
/* sticky rank + name in the Best Available tables too (Draft Room / Grid View) */
.avail-table tr:not(.grouprow) th:nth-child(1), .avail-table td:nth-child(1) {
  position: sticky; left: 0; background: var(--panel); z-index: 2; width: 44px; min-width: 44px;
}
.avail-table tr:not(.grouprow) th:nth-child(2), .avail-table td:nth-child(2) {
  position: sticky; left: 44px; background: var(--panel); z-index: 2; box-shadow: 1px 0 0 var(--border);
}
.avail-table thead tr:not(.grouprow) th:nth-child(1),
.avail-table thead tr:not(.grouprow) th:nth-child(2) { z-index: 7; }
.avail-table tr:hover td:nth-child(1), .avail-table tr:hover td:nth-child(2) { background: #17202f; }
td.statcol { border-left: 1px solid rgba(35,43,61,.35); }
.grouprow th { padding: 4px 10px; top: 0; }
.grouprow th.group { text-align: center; font-weight: 800; border-left: 2px solid var(--border); }
.grouprow th.proj { color: var(--accent); }
.grouprow th.act { color: var(--accent2); }
thead tr.sub th { top: 25px; }
tr:hover td { background: rgba(74,168,255,.05); }
tr.gone td { opacity: .32; text-decoration: line-through; }
tr.mine td { background: rgba(45,212,167,.07); }
.pname { font-weight: 650; }
.ptag { font-size: 11.5px; color: var(--muted); }
.pos {
  display: inline-block; min-width: 34px; text-align: center; padding: 2px 6px; border-radius: 5px;
  font-size: 11px; font-weight: 800; letter-spacing: .4px; color: #06121f;
}
.pos.QB { background: var(--qb); } .pos.RB { background: var(--rb); } .pos.WR { background: var(--wr); }
.pos.TE { background: var(--te); } .pos.K { background: var(--k); } .pos.DST { background: var(--dst); }
.inj { color: var(--down); font-weight: 800; font-size: 11px; margin-left: 5px; }
.customtag { color: var(--accent); font-size: 12px; }
.qbtn {
  width: 24px; height: 24px; border-radius: 5px; border: 1px solid var(--border);
  background: var(--panel2); font-size: 14px; line-height: 1; color: var(--muted);
}
.qbtn:hover { border-color: #ffd166; color: #ffd166; }
.qbtn.on { color: #ffd166; border-color: rgba(255,209,102,.55); background: rgba(255,209,102,.1); }
.wctl { display: inline-flex; align-items: center; gap: 5px; }
.wbtn { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--border); background: var(--panel2); font-weight: 800; line-height: 1; }
.wbtn:hover { border-color: var(--accent); }
.wval { min-width: 42px; text-align: center; font-weight: 700; font-size: 12.5px; border-radius: 5px; padding: 2px 4px; cursor: pointer; }
.wval.up { color: var(--up); background: rgba(45,212,167,.12); }
.wval.down { color: var(--down); background: rgba(239,70,102,.12); }
.wval.zero { color: var(--muted); }
.vorpos { color: var(--up); } .vorneg { color: var(--down); }

/* Settings modal */
.overlay { position: fixed; inset: 0; background: rgba(4,7,12,.72); z-index: 90; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow: auto; }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; width: 640px; max-width: 100%; }
.modal h2 { font-size: 17px; margin-bottom: 4px; }
.modal h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin: 16px 0 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px 12px; }
.grid label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.warn { color: #f59e0b; font-size: 12.5px; margin-top: 10px; }
.lockmsg { color: var(--muted); font-size: 12.5px; margin-top: 6px; font-style: italic; }

/* Draft room */
.setupcard { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 720px; margin: 30px auto; }
.setupcard h2 { margin-bottom: 12px; }
.mode { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
.modeopt { min-width: 200px; }
.modeopt { flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 14px; cursor: pointer; }
.modeopt.on { border-color: var(--accent); background: rgba(74,168,255,.08); }
.modeopt b { display: block; margin-bottom: 4px; }
.modeopt div { font-size: 12.5px; color: var(--muted); }
.draftbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px;
}
.onclock { font-weight: 800; }
.onclock .you { color: var(--accent2); }
.pickchip { background: var(--panel2); border-radius: 6px; padding: 3px 9px; font-weight: 700; font-size: 12.5px; }
.draftcols { display: grid; grid-template-columns: minmax(430px, 1.05fr) minmax(380px, 1fr); gap: 14px; align-items: start; }
.draftcols.resizable { gap: 0 8px; }
.draftcols > * { min-width: 0; } /* panes shrink below content width; wide tables scroll inside */
@media (max-width: 980px) {
  .draftcols, .draftcols.resizable { grid-template-columns: 1fr !important; }
  .vsplit { display: none; }
}
/* draggable splitters */
.vsplit { width: 6px; align-self: stretch; background: var(--border); border-radius: 3px; cursor: col-resize; }
.vsplit:hover, body.dragv .vsplit { background: var(--accent); }
.hsplit { height: 7px; background: var(--border); border-radius: 3px; cursor: row-resize; margin: 9px 0; }
.hsplit:hover, body.dragh .hsplit { background: var(--accent); }
body.dragv { cursor: col-resize; user-select: none; }
body.dragh { cursor: row-resize; user-select: none; }
.tworow { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; align-items: start; }
@media (max-width: 980px) { .tworow { grid-template-columns: 1fr; } }
/* maximized grid cells */
.dgrid.big th, .dgrid.big td { min-width: 108px; padding: 5px 8px; font-size: 12.5px; }
.dgrid.big td.rd { min-width: 40px; }
.dgrid.big .cellp .nm { max-width: 150px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
.panel .phead { padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.recs { display: flex; flex-direction: column; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: rgba(45,212,167,.05); }
.recs.collapsed { padding: 7px 14px; }
.recshead { display: flex; align-items: center; cursor: pointer; user-select: none; }
.recshead:hover .rectoggle { color: var(--accent); }
.rectoggle { margin-left: auto; color: var(--muted); font-size: 13px; padding: 0 4px; }
.recrow { display: flex; align-items: center; gap: 8px; }
.recrow .why { margin-left: auto; font-size: 12px; color: var(--muted); }
.gridwrap { overflow: auto; max-height: 46vh; }
.dgrid { border-collapse: collapse; font-size: 11.5px; }
.dgrid th, .dgrid td { border: 1px solid var(--border); padding: 3px 6px; min-width: 86px; }
.dgrid th { position: sticky; top: 0; background: var(--panel2); z-index: 4; cursor: default; }
.dgrid td.rd { position: sticky; left: 0; background: var(--panel2); font-weight: 700; min-width: 34px; text-align: center; }
.dgrid td.usercol { background: rgba(74,168,255,.07); }
.cellp { border-left: 3px solid transparent; padding-left: 4px; }
.cellp .nm { font-weight: 650; display: block; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
.cellp.QB { border-color: var(--qb); } .cellp.RB { border-color: var(--rb); } .cellp.WR { border-color: var(--wr); }
.cellp.TE { border-color: var(--te); } .cellp.K { border-color: var(--k); } .cellp.DST { border-color: var(--dst); }
.log { max-height: 150px; overflow: auto; padding: 8px 14px; font-size: 12.5px; }
.log div { padding: 2px 0; }
.rosterlist { padding: 10px 14px; }
.rosterlist .rrow { display: flex; gap: 10px; padding: 3px 0; border-bottom: 1px dashed rgba(35,43,61,.6); align-items: center; }
.recaprow { cursor: pointer; user-select: none; }
.recaprow:hover { background: rgba(74,168,255,.06); }
.recaplineup { padding: 4px 0 8px 42px; background: rgba(74,168,255,.03); border-bottom: 1px solid var(--border); }
.recaplineup .rrow { border-bottom: 1px dashed rgba(35,43,61,.4); font-size: 13px; }
.rosterlist .slot { width: 44px; font-weight: 700; color: var(--muted); font-size: 12px; }
.avail-table td { padding: 5px 8px; }

/* assistant dock */
.assist {
  position: fixed; top: 58px; right: 12px; bottom: 12px; width: 380px; max-width: calc(100vw - 24px);
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px; z-index: 80;
  display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,.45);
}
.ahead { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 800; }
.chatlog { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 92%; padding: 8px 11px; border-radius: 10px; font-size: 13px; line-height: 1.5; }
.msg.u { align-self: flex-end; background: var(--accent); color: #06121f; font-weight: 600; }
.msg.a { align-self: flex-start; background: var(--panel2); border: 1px solid var(--border); }
.msg.a b { color: var(--accent); }
.msg.a .inj { color: var(--down); font-weight: 700; }
.achips { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 12px; border-top: 1px solid var(--border); }
.abar { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
.abar input { flex: 1; }

/* toast */
#toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: var(--panel2); border: 1px solid var(--accent); color: var(--text);
  padding: 10px 18px; border-radius: 9px; font-weight: 600; z-index: 200;
  opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw;
}
#toast.show { opacity: 1; }
.footnote { margin-top: 14px; font-size: 12px; color: var(--muted); }
.footnote a { color: var(--accent); }
kbd { background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; font-size: 11px; }
</style>
</head>
<body>
<header>
  <div class="logo">🏈 Draft Lab <span>'26</span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="hbtns" id="hbtns"></div>
</header>
<main id="view"></main>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json" hidden>
