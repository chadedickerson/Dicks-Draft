<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft Lab '26 — Fantasy Football Draft Board</title>
<style>
:root {
  --bg: #0b0e14; --panel: #141926; --panel2: #1a2133; --border: #232b3d;
  --text: #e8ecf4; --muted: #8b95a8; --accent: #4aa8ff; --accent2: #2dd4a7;
  --up: #2dd4a7; --down: #ef4666;
  --qb: #ef4666; --rb: #2dd4a7; --wr: #4aa8ff; --te: #f59e0b; --k: #a78bfa; --dst: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
input:focus, select:focus { outline: 1px solid var(--accent); }
input[type=number] { width: 64px; }

/* Header is sized in viewport units (vw/vh), which do NOT grow with browser
   zoom — zoom in to enlarge the boards for a TV and the menu stays compact. */
header {
  display: flex; align-items: center; gap: .9vw; flex-wrap: wrap;
  padding: .5vh 1vw; background: var(--panel); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 40;
  font-size: max(.72vw, 1.3vh);
}
.logo { font-weight: 800; font-size: max(.9vw, 1.6vh); letter-spacing: .3px; white-space: nowrap; }
.logo span { color: var(--accent); }
.tabs { display: flex; gap: .2vw; background: var(--panel2); border-radius: .4vw; padding: .15vw; }
.tabs button { padding: .35vh .85vw; border-radius: .3vw; color: var(--muted); font-weight: 600; font-size: max(.72vw, 1.3vh); }
.tabs button.on { background: var(--accent); color: #06121f; }
.hbtns { margin-left: auto; display: flex; gap: .45vw; flex-wrap: wrap; }
.hbtns .btn { padding: .35vh .6vw; font-size: max(.72vw, 1.3vh); border-radius: .35vw; }
.livebadge {
  display: inline-flex; align-items: center; padding: .3vh .6vw; border-radius: .35vw;
  font-weight: 800; font-size: max(.66vw, 1.2vh); letter-spacing: .4px;
  background: rgba(45,212,167,.13); color: var(--accent2); border: 1px solid rgba(45,212,167,.4);
}
.livebadge.c { background: rgba(74,168,255,.13); color: var(--accent); border-color: rgba(74,168,255,.4); }
.btn {
  padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--panel2); font-weight: 600; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #06121f; border-color: var(--accent); }
.btn.danger { color: var(--down); }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .4; cursor: default; }

main { padding: 16px 18px 60px; width: 100%; margin: 0 auto; }
.muted { color: var(--muted); }
.mono { font-variant-numeric: tabular-nums; }

/* Board */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.chips { display: flex; gap: 4px; }
.chip { padding: 4px 11px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); font-weight: 600; font-size: 12.5px; }
.chip.on { background: var(--panel2); color: var(--text); border-color: var(--accent); }
.tablewrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: auto; max-height: calc(100vh - 210px); /* refined per-render by fitPanes() */ }
table { border-collapse: collapse; width: 100%; }
th {
  text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
  padding: 9px 10px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); z-index: 5;
  white-space: nowrap; cursor: pointer; user-select: none;
}
th.nosort { cursor: default; }
th .arr { color: var(--accent); }
td { padding: 7px 10px; border-bottom: 1px solid rgba(35,43,61,.55); white-space: nowrap; }
th.statcol, td.statcol { padding-left: 6px; padding-right: 6px; font-size: 12.5px; }
/* sticky rank + player-name columns on the Player Board (horizontal scroll) */
.tablewrap tr:not(.grouprow) th:nth-child(1), .tablewrap td:nth-child(1) {
  position: sticky; left: 0; background: var(--panel); z-index: 2;
  width: 48px; min-width: 48px;
}
.tablewrap tr:not(.grouprow) th:nth-child(2), .tablewrap td:nth-child(2) {
  position: sticky; left: 48px; background: var(--panel); z-index: 2;
  box-shadow: 1px 0 0 var(--border);
}
.tablewrap thead tr:not(.grouprow) th:nth-child(1),
.tablewrap thead tr:not(.grouprow) th:nth-child(2) { z-index: 7; }
.tablewrap tr:hover td:nth-child(1), .tablewrap tr:hover td:nth-child(2) { background: #17202f; }
/* keep sticky cells opaque for drafted (struck-through) rows */
.tablewrap tr.gone td:nth-child(1), .tablewrap tr.gone td:nth-child(2) { opacity: 1; }
.tablewrap tr.gone td:nth-child(2) > * { opacity: .32; }
.tablewrap tr.gone td:nth-child(1) { color: rgba(139,149,168,.35); }
/* sticky rank + name in the Best Available tables too (Draft Room / Grid View) */
.avail-table tr:not(.grouprow) th:nth-child(1), .avail-table td:nth-child(1) {
  position: sticky; left: 0; background: var(--panel); z-index: 2; width: 44px; min-width: 44px;
}
.avail-table tr:not(.grouprow) th:nth-child(2), .avail-table td:nth-child(2) {
  position: sticky; left: 44px; background: var(--panel); z-index: 2; box-shadow: 1px 0 0 var(--border);
}
.avail-table thead tr:not(.grouprow) th:nth-child(1),
.avail-table thead tr:not(.grouprow) th:nth-child(2) { z-index: 7; }
.avail-table tr:hover td:nth-child(1), .avail-table tr:hover td:nth-child(2) { background: #17202f; }
td.statcol { border-left: 1px solid rgba(35,43,61,.35); }
.grouprow th { padding: 4px 10px; top: 0; }
.grouprow th.group { text-align: center; font-weight: 800; border-left: 2px solid var(--border); }
.grouprow th.proj { color: var(--accent); }
.grouprow th.act { color: var(--accent2); }
thead tr.sub th { top: 25px; }
tr:hover td { background: rgba(74,168,255,.05); }
tr.gone td { opacity: .32; text-decoration: line-through; }
tr.mine td { background: rgba(45,212,167,.07); }
.pname { font-weight: 650; }
.ptag { font-size: 11.5px; color: var(--muted); }
.pos {
  display: inline-block; min-width: 34px; text-align: center; padding: 2px 6px; border-radius: 5px;
  font-size: 11px; font-weight: 800; letter-spacing: .4px; color: #06121f;
}
.pos.QB { background: var(--qb); } .pos.RB { background: var(--rb); } .pos.WR { background: var(--wr); }
.pos.TE { background: var(--te); } .pos.K { background: var(--k); } .pos.DST { background: var(--dst); }
.inj { color: var(--down); font-weight: 800; font-size: 11px; margin-left: 5px; }
.customtag { color: var(--accent); font-size: 12px; }
.qbtn {
  width: 24px; height: 24px; border-radius: 5px; border: 1px solid var(--border);
  background: var(--panel2); font-size: 14px; line-height: 1; color: var(--muted);
}
.qbtn:hover { border-color: #ffd166; color: #ffd166; }
.qbtn.on { color: #ffd166; border-color: rgba(255,209,102,.55); background: rgba(255,209,102,.1); }
.wctl { display: inline-flex; align-items: center; gap: 5px; }
.wbtn { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--border); background: var(--panel2); font-weight: 800; line-height: 1; }
.wbtn:hover { border-color: var(--accent); }
.wval { min-width: 42px; text-align: center; font-weight: 700; font-size: 12.5px; border-radius: 5px; padding: 2px 4px; cursor: pointer; }
.wval.up { color: var(--up); background: rgba(45,212,167,.12); }
.wval.down { color: var(--down); background: rgba(239,70,102,.12); }
.wval.zero { color: var(--muted); }
.vorpos { color: var(--up); } .vorneg { color: var(--down); }

/* Settings modal */
.overlay { position: fixed; inset: 0; background: rgba(4,7,12,.72); z-index: 90; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow: auto; }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; width: 640px; max-width: 100%; }
.modal h2 { font-size: 17px; margin-bottom: 4px; }
.modal h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin: 16px 0 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px 12px; }
.grid label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.warn { color: #f59e0b; font-size: 12.5px; margin-top: 10px; }
.lockmsg { color: var(--muted); font-size: 12.5px; margin-top: 6px; font-style: italic; }

/* Draft room */
.setupcard { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 720px; margin: 30px auto; }
.setupcard h2 { margin-bottom: 12px; }
.mode { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
.modeopt { min-width: 200px; }
.modeopt { flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 14px; cursor: pointer; }
.modeopt.on { border-color: var(--accent); background: rgba(74,168,255,.08); }
.modeopt b { display: block; margin-bottom: 4px; }
.modeopt div { font-size: 12.5px; color: var(--muted); }
.draftbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px;
}
.onclock { font-weight: 800; }
.onclock .you { color: var(--accent2); }
.pickchip { background: var(--panel2); border-radius: 6px; padding: 3px 9px; font-weight: 700; font-size: 12.5px; }
.draftcols { display: grid; grid-template-columns: minmax(430px, 1.05fr) minmax(380px, 1fr); gap: 14px; align-items: start; }
.draftcols.resizable { gap: 0 8px; }
.draftcols > * { min-width: 0; } /* panes shrink below content width; wide tables scroll inside */
@media (max-width: 980px) {
  .draftcols, .draftcols.resizable { grid-template-columns: 1fr !important; }
  .vsplit { display: none; }
}
/* draggable splitters */
.vsplit { width: 6px; align-self: stretch; background: var(--border); border-radius: 3px; cursor: col-resize; }
.vsplit:hover, body.dragv .vsplit { background: var(--accent); }
.hsplit { height: 7px; background: var(--border); border-radius: 3px; cursor: row-resize; margin: 9px 0; }
.hsplit:hover, body.dragh .hsplit { background: var(--accent); }
body.dragv { cursor: col-resize; user-select: none; }
body.dragh { cursor: row-resize; user-select: none; }
.tworow { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; align-items: start; }
@media (max-width: 980px) { .tworow { grid-template-columns: 1fr; } }
/* maximized grid cells */
.dgrid.big th, .dgrid.big td { min-width: 108px; padding: 5px 8px; font-size: 12.5px; }
.dgrid.big td.rd { min-width: 40px; }
.dgrid.big .cellp .nm { max-width: 150px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
.panel .phead { padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.recs { display: flex; flex-direction: column; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: rgba(45,212,167,.05); }
.recs.collapsed { padding: 7px 14px; }
.recshead { display: flex; align-items: center; cursor: pointer; user-select: none; }
.recshead:hover .rectoggle { color: var(--accent); }
.rectoggle { margin-left: auto; color: var(--muted); font-size: 13px; padding: 0 4px; }
.recrow { display: flex; align-items: center; gap: 8px; }
.recrow .why { margin-left: auto; font-size: 12px; color: var(--muted); }
.gridwrap { overflow: auto; max-height: 46vh; }
.dgrid { border-collapse: collapse; font-size: 11.5px; }
.dgrid th, .dgrid td { border: 1px solid var(--border); padding: 3px 6px; min-width: 86px; }
.dgrid th { position: sticky; top: 0; background: var(--panel2); z-index: 4; cursor: default; }
.dgrid td.rd { position: sticky; left: 0; background: var(--panel2); font-weight: 700; min-width: 34px; text-align: center; }
.dgrid td.usercol { background: rgba(74,168,255,.07); }
.cellp { border-left: 3px solid transparent; padding-left: 4px; }
.cellp .nm { font-weight: 650; display: block; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
.cellp.QB { border-color: var(--qb); } .cellp.RB { border-color: var(--rb); } .cellp.WR { border-color: var(--wr); }
.cellp.TE { border-color: var(--te); } .cellp.K { border-color: var(--k); } .cellp.DST { border-color: var(--dst); }
.log { max-height: 150px; overflow: auto; padding: 8px 14px; font-size: 12.5px; }
.log div { padding: 2px 0; }
.rosterlist { padding: 10px 14px; }
.rosterlist .rrow { display: flex; gap: 10px; padding: 3px 0; border-bottom: 1px dashed rgba(35,43,61,.6); align-items: center; }
.recaprow { cursor: pointer; user-select: none; }
.recaprow:hover { background: rgba(74,168,255,.06); }
.recaplineup { padding: 4px 0 8px 42px; background: rgba(74,168,255,.03); border-bottom: 1px solid var(--border); }
.recaplineup .rrow { border-bottom: 1px dashed rgba(35,43,61,.4); font-size: 13px; }
.rosterlist .slot { width: 44px; font-weight: 700; color: var(--muted); font-size: 12px; }
.avail-table td { padding: 5px 8px; }

/* assistant dock */
.assist {
  position: fixed; top: 58px; right: 12px; bottom: 12px; width: 380px; max-width: calc(100vw - 24px);
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px; z-index: 80;
  display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,.45);
}
.ahead { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 800; }
.chatlog { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 92%; padding: 8px 11px; border-radius: 10px; font-size: 13px; line-height: 1.5; }
.msg.u { align-self: flex-end; background: var(--accent); color: #06121f; font-weight: 600; }
.msg.a { align-self: flex-start; background: var(--panel2); border: 1px solid var(--border); }
.msg.a b { color: var(--accent); }
.msg.a .inj { color: var(--down); font-weight: 700; }
.achips { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 12px; border-top: 1px solid var(--border); }
.abar { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
.abar input { flex: 1; }

/* toast */
#toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: var(--panel2); border: 1px solid var(--accent); color: var(--text);
  padding: 10px 18px; border-radius: 9px; font-weight: 600; z-index: 200;
  opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw;
}
#toast.show { opacity: 1; }
.footnote { margin-top: 14px; font-size: 12px; color: var(--muted); }
.footnote a { color: var(--accent); }
kbd { background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; font-size: 11px; }
</style>
</head>

  <div class="logo">🏈 Draft Lab <span>'26</span></div>

  <div class="hbtns" id="hbtns"></div>
</header>
<main id="view"></main>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json" hidden>

<script>
// ===== Core logic (pure — no DOM). Unit-testable in Node. =====

const SCORING_PRESETS = {
  standard: { name: 'Standard',  rec: 0   },
  half:     { name: 'Half PPR',  rec: 0.5 },
  ppr:      { name: 'Full PPR',  rec: 1   },
};

function defaultSettings() {
  return {
    preset: 'half',
    scoring: {
      payd: 0.04, patd: 4, int: -1, ruyd: 0.1, rutd: 6, rec: 0.5, reyd: 0.1, retd: 6, fum: -2,
      sack: -0.5,                                  // per sack TAKEN by your QB
      fg019: 3, fg2029: 3, fg3039: 3, fg4049: 4, fg50: 5,  // FG made by distance
      fgm019: 0, fgm2029: 0,                       // FG missed penalties (short misses)
      xpPts: 1,                                    // XP made
      dstSack: 1, dstInt: 2, dstFum: 2, dstTd: 6,  // team defense
    },
    teams: 12,
    userSlot: 5,
    roster: { QB: 1, RB: 2, WR: 2, TE: 1, FLEX: 1, K: 1, DST: 1, BN: 6 },
  };
}

function totalRounds(settings) {
  const r = settings.roster;
  return r.QB + r.RB + r.WR + r.TE + r.FLEX + r.K + r.DST + r.BN;
}

// --- Scoring ---
function projPoints(player, scoring) {
  const s = player.stats;
  if (player.pos === 'K') {
    const g = (k, d) => scoring[k] != null ? scoring[k] : d;
    return round1(
      (s.fg019 || 0) * g('fg019', 3) + (s.fg2029 || 0) * g('fg2029', 3) + (s.fg3039 || 0) * g('fg3039', 3) +
      (s.fg4049 || 0) * g('fg4049', 4) + (s.fg50 || 0) * g('fg50', 5) +
      (s.fgm019 || 0) * g('fgm019', 0) + (s.fgm2029 || 0) * g('fgm2029', 0) +
      s.xp * g('xpPts', 1)
    );
  }
  if (player.pos === 'DST') return round1(
    (s.paBase || 0) +
    s.sacks * (scoring.dstSack != null ? scoring.dstSack : 1) +
    s.dint  * (scoring.dstInt  != null ? scoring.dstInt  : 2) +
    s.fumrec * (scoring.dstFum != null ? scoring.dstFum : 2) +
    s.dtd   * (scoring.dstTd   != null ? scoring.dstTd   : 6)
  );
  return round1(
    (s.payd || 0) * scoring.payd + (s.patd || 0) * scoring.patd + (s.int || 0) * scoring.int +
    (s.ruyd || 0) * scoring.ruyd + (s.rutd || 0) * scoring.rutd +
    (s.rec  || 0) * scoring.rec  + (s.reyd || 0) * scoring.reyd + (s.retd || 0) * scoring.retd +
    (s.fum  || 0) * scoring.fum  + (s.sk   || 0) * (scoring.sack || 0)
  );
}
function round1(x) { return Math.round(x * 10) / 10; }

// Weight step (-5..+5) → points multiplier (±3% per step)
const WEIGHT_PCT = 0.03;
function adjPoints(player, scoring, weights) {
  const w = weights[player.id] || 0;
  return round1(projPoints(player, scoring) * (1 + w * WEIGHT_PCT));
}

// --- Value Over Replacement ---
// Replacement rank per position derived from league size + roster shape.
function replacementRanks(settings) {
  const t = settings.teams, r = settings.roster;
  return {
    QB:  Math.round(t * (r.QB + 0.15)),
    RB:  Math.round(t * (r.RB + r.FLEX * 0.45 + 0.4)),
    WR:  Math.round(t * (r.WR + r.FLEX * 0.45 + 0.4)),
    TE:  Math.round(t * (r.TE + r.FLEX * 0.10 + 0.15)),
    K:   t,
    DST: t,
  };
}

// Compute {id → {proj, adj, vor, adjVor}} for all players.
function computeValues(players, settings, weights) {
  const repl = replacementRanks(settings);
  const byPos = {};
  for (const p of players) (byPos[p.pos] = byPos[p.pos] || []).push(p);
  const baseline = {}, adjBaseline = {};
  for (const pos of Object.keys(byPos)) {
    const base = byPos[pos].map(p => projPoints(p, settings.scoring)).sort((a, b) => b - a);
    const adj  = byPos[pos].map(p => adjPoints(p, settings.scoring, weights)).sort((a, b) => b - a);
    const idx = Math.min(repl[pos] - 1, base.length - 1);
    baseline[pos] = base[Math.max(0, idx)];
    adjBaseline[pos] = adj[Math.max(0, idx)];
  }
  const out = {};
  for (const p of players) {
    const proj = projPoints(p, settings.scoring);
    const adj = adjPoints(p, settings.scoring, weights);
    out[p.id] = {
      proj, adj,
      vor: round1(proj - baseline[p.pos]),
      adjVor: round1(adj - adjBaseline[p.pos]),
    };
  }
  return out;
}

// --- Snake draft ---
function pickTeam(pickIndex, teams) { // 0-based pick index → 0-based team index
  const round = Math.floor(pickIndex / teams);
  const i = pickIndex % teams;
  return round % 2 === 0 ? i : teams - 1 - i;
}
function pickLabel(pickIndex, teams) {
  const round = Math.floor(pickIndex / teams) + 1;
  return round + '.' + String((pickIndex % teams) + 1).padStart(2, '0');
}

// Assign a drafted player list to display slots (starters → FLEX → bench)
function assignSlots(roster, players) { // players in draft order
  const slots = [];
  const open = { QB: roster.QB, RB: roster.RB, WR: roster.WR, TE: roster.TE, FLEX: roster.FLEX, K: roster.K, DST: roster.DST };
  for (const p of players) {
    if (open[p.pos] > 0) { open[p.pos]--; slots.push({ slot: p.pos, p }); }
    else if ((p.pos === 'RB' || p.pos === 'WR' || p.pos === 'TE') && open.FLEX > 0) { open.FLEX--; slots.push({ slot: 'FLEX', p }); }
    else slots.push({ slot: 'BN', p });
  }
  return slots;
}

function posCounts(list) {
  const c = { QB: 0, RB: 0, WR: 0, TE: 0, K: 0, DST: 0 };
  for (const p of list) c[p.pos]++;
  return c;
}

// Unfilled *starter* slots for a team (FLEX counts RB/WR/TE overflow)
function unfilledStarters(roster, teamPlayers) {
  const c = posCounts(teamPlayers);
  const need = [];
  let flexOver = 0;
  for (const pos of ['RB', 'WR', 'TE']) {
    const over = Math.max(0, c[pos] - roster[pos]);
    flexOver += over;
  }
  for (const pos of ['QB', 'RB', 'WR', 'TE', 'K', 'DST']) {
    const short = Math.max(0, roster[pos] - c[pos]);
    for (let i = 0; i < short; i++) need.push(pos);
  }
  const flexShort = Math.max(0, roster.FLEX - flexOver);
  for (let i = 0; i < flexShort; i++) need.push('FLEX');
  return need; // e.g. ['RB','WR','FLEX','K','DST']
}

// --- AI drafting brain ---
// AI teams draft off consensus (ADP + base VOR) with need logic + randomness.
// `rng` is injectable for testability.
function aiSelect(available, teamPlayers, settings, values, pickIndex, rng) {
  rng = rng || Math.random;
  const teams = settings.teams;
  const roster = settings.roster;
  const round = Math.floor(pickIndex / teams) + 1;
  const rounds = totalRounds(settings);
  const picksLeft = rounds - round + 1; // including this one
  const c = posCounts(teamPlayers);
  const need = unfilledStarters(roster, teamPlayers);
  const needSet = new Set(need);

  const caps = {
    QB: roster.QB + 1, TE: roster.TE + 1, K: roster.K, DST: roster.DST,
    RB: 99, WR: 99,
  };
  const lateOnly = { K: true, DST: true };

  const eligible = available.filter(p => {
    if (c[p.pos] >= caps[p.pos]) return false;
    // K/DST: only when needed and late (last ~3 rounds), or forced
    if (lateOnly[p.pos]) {
      if (!needSet.has(p.pos)) return false;
      if (picksLeft > need.length + 2) return false;
    }
    // 2nd QB/TE only after starters mostly filled or late
    if (p.pos === 'QB' && c.QB >= roster.QB && round < rounds - 4) return false;
    if (p.pos === 'TE' && c.TE >= roster.TE && round < rounds - 4) return false;
    return true;
  });

  // Endgame: if picks remaining == starter needs, only fill needs
  let pool = eligible;
  if (picksLeft <= need.length) {
    pool = eligible.filter(p =>
      needSet.has(p.pos) ||
      (needSet.has('FLEX') && (p.pos === 'RB' || p.pos === 'WR' || p.pos === 'TE')));
    if (pool.length === 0) pool = eligible;
  }
  if (pool.length === 0) pool = available;

  // Scarcity: how many remain at each pos vs how many starter slots the
  // league still needs there. If a needed position is drying up, act now.
  const remaining = posCounts(available);

  // Rank by ADP, take a window, score by base VOR + need bonus + jitter
  const window = pool.slice().sort((a, b) => a.adp - b.adp).slice(0, 10);
  // Make sure scarce needed positions are represented in the window
  for (const pos of needSet) {
    if (pos === 'FLEX' || lateOnly[pos]) continue;
    if (remaining[pos] <= teams * 1.25 && !window.some(p => p.pos === pos)) {
      const top = available.filter(p => p.pos === pos).sort((a, b) => a.adp - b.adp).slice(0, 2);
      window.push(...top);
    }
  }
  let best = null, bestScore = -Infinity;
  for (const p of window) {
    const v = values[p.id];
    let score = v.vor;
    if (needSet.has(p.pos)) {
      score += 6;
      if (remaining[p.pos] <= teams * 1.25) score += 30; // pool drying up — fill it now
    }
    else if (needSet.has('FLEX') && (p.pos === 'RB' || p.pos === 'WR')) score += 3;
    score += (p.adp - pickIndex - 1) < -12 ? -8 : 0; // don't reach past big faller? (falling player = bonus actually)
    score += rng() * 10; // jitter → drafts differ run to run
    if (score > bestScore) { bestScore = score; best = p; }
  }
  return best || pool[0];
}

// Recommendations for the human: adjusted VOR (their weights), need-aware
function recommend(available, teamPlayers, settings, values, count) {
  const need = new Set(unfilledStarters(settings.roster, teamPlayers));
  return available.slice()
    .sort((a, b) => {
      const sa = values[a.id].adjVor + (need.has(a.pos) ? 4 : 0);
      const sb = values[b.id].adjVor + (need.has(b.pos) ? 4 : 0);
      return sb - sa;
    })
    .slice(0, count || 5);
}

<script>
// ===== Draft Assistant (pure logic — no DOM). =====
// askAssistant(question, ctx) → { html } where ctx supplies live draft state:
//   players, values, rankMap, settings, weights,
//   available()          → undrafted players
//   rosterOf(teamIdx)    → players drafted by team
//   onClockTeam          → team index on the clock (or null pre-draft)
//   userTeam             → user's team index
//   pickIndex            → current overall pick index (or null)
//   draftActive          → bool
// Depends on: PLAYOFF_SOS, PLAYOFF_WEEKS, replacementRanks, WEIGHT_PCT.

const POS_WORDS = {
  qb: 'QB', quarterback: 'QB', rb: 'RB', 'running back': 'RB', wr: 'WR', receiver: 'WR', 'wide receiver': 'WR',
  te: 'TE', 'tight end': 'TE', k: 'K', kicker: 'K', dst: 'DST', def: 'DST', defense: 'DST', 'd/st': 'DST',
};

function aNorm(s) { return s.toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim(); }

function findPlayers(q, players, max) {
  const nq = ' ' + aNorm(q) + ' ';
  const hits = [];
  for (const p of players) {
    const full = aNorm(p.name);
    if (nq.includes(' ' + full + ' ')) { hits.push({ p, len: full.length + 100 }); continue; }
    const parts = full.split(' ');
    const last = parts[parts.length - 1];
    if (last.length >= 4 && nq.includes(' ' + last + ' ')) hits.push({ p, len: last.length });
    else if (parts[0].length >= 4 && nq.includes(' ' + parts[0] + ' ') && parts[0] !== 'san') hits.push({ p, len: parts[0].length - 1 });
  }
  hits.sort((a, b) => b.len - a.len || (a.p.adp - b.p.adp));
  const out = [], seen = new Set();
  for (const h of hits) { if (!seen.has(h.p.id)) { seen.add(h.p.id); out.push(h.p); } }
  return out.slice(0, max || 4);
}

function posInQuery(q) {
  const nq = aNorm(q);
  for (const [w, pos] of Object.entries(POS_WORDS)) {
    if (new RegExp('(^|\\W)' + w + 's?(\\W|$)').test(nq)) return pos;
  }
  return null;
}

function favWord(f) { return f >= 8 ? 'great' : f >= 3 ? 'good' : f > -3 ? 'neutral' : f > -8 ? 'tough' : 'brutal'; }
function favMark(f) { return f >= 3 ? '✅' : f > -3 ? '➖' : '❌'; }
function sosLine(team) {
  const s = PLAYOFF_SOS[team];
  if (!s) return null;
  return s.w.map((x, i) => `W${PLAYOFF_WEEKS[i]} ${x.opp} ${favMark(x.fav)}`).join(' · ') + ` — playoff SOS rank ${s.rank}/32`;
}

function pName(p) { return `<b>${p.name}</b> <span class="ptag">${p.pos}·${p.team}</span>`; }

function askAssistant(q, ctx) {
  const { players, values, rankMap, settings } = ctx;
  const nq = aNorm(q);
  const avail = ctx.available();
  const pos = posInQuery(q);
  const named = findPlayers(q, players, 4);

  const li = items => `<ul style="margin:4px 0 4px 16px;padding:0">${items.map(x => `<li style="margin:2px 0">${x}</li>`).join('')}</ul>`;

  // HELP
  if (/^(help|\?|what can|hi$|hello)/.test(nq)) {
    return { html: `I can answer things like:` + li([
      `“<i>Who should I take?</i>” — pick advice for the team on the clock`,
      `“<i>Best RB available</i>” / “<i>top TEs</i>”`,
      `“<i>When is Gibbs' bye?</i>” / “<i>bye conflicts on my roster</i>” / “<i>who has bye week 7?</i>”`,
      `“<i>How is Chase Brown's playoff schedule?</i>” / “<i>best playoff matchups for WRs</i>”`,
      `“<i>Jahmyr Gibbs or Bijan?</i>” — head-to-head compare`,
      `“<i>When should I draft a QB?</i>” — scarcity check`,
      `“<i>Tell me about Puka Nacua</i>”`]) };
  }

  // COMPARE: two names + or/vs
  if (named.length >= 2 && /\b(or|vs|versus|over)\b/.test(nq)) {
    const [a, b] = named;
    const va = values[a.id], vb = values[b.id];
    const sa = PLAYOFF_SOS[a.team], sb = PLAYOFF_SOS[b.team];
    const better = va.adjVor >= vb.adjVor ? a : b;
    const diff = Math.abs(va.adjVor - vb.adjVor);
    const rows = [a, b].map(p => {
      const v = values[p.id];
      const s = PLAYOFF_SOS[p.team];
      return `${pName(p)} — proj <b>${v.adj}</b>, VOR <b>${v.adjVor}</b>, ADP ${p.adp}, bye ${p.bye}${p.injury ? `, <span class="inj">${p.injury}</span>` : ''}, playoff SOS ${s ? s.rank + '/32' : '—'}`;
    });
    let verdict = `<b>${better.name}</b> by my numbers (${diff.toFixed(1)} VOR edge${diff < 5 ? ' — basically a coin flip, take your guy' : ''}).`;
    if (a.pos !== b.pos) verdict += ` They play different positions, so roster need should break the tie.`;
    if (sa && sb && Math.abs(sa.rank - sb.rank) >= 12) {
      const eas = sa.rank < sb.rank ? a : b;
      verdict += ` Playoff schedule clearly favors ${eas.name} (${PLAYOFF_SOS[eas.team].rank}/32).`;
    }
    return { html: li(rows) + verdict };
  }

  // WHO SHOULD I TAKE
  if (/(who|what).*(take|pick|draft)|best pick|recommend|whom/.test(nq) && !pos) {
    const ti = ctx.draftActive ? (ctx.onClockTeam != null ? ctx.onClockTeam : ctx.userTeam) : ctx.userTeam;
    const your = ti === ctx.userTeam ? 'your' : 'their';
    const roster = ctx.rosterOf(ti);
    const recs = recommend(avail, roster, settings, values, 3);
    if (!recs.length) return { html: `Nobody left to draft!` };
    const need = unfilledStarters(settings.roster, roster);
    const items = recs.map((p, i) => {
      const v = values[p.id];
      const posLeft = avail.filter(x => x.pos === p.pos && values[x.id].adjVor > 0).length;
      const nextAtPos = avail.filter(x => x.pos === p.pos && x.id !== p.id).sort((x, y) => values[y.id].adjVor - values[x.id].adjVor)[0];
      const cliff = nextAtPos ? (v.adjVor - values[nextAtPos.id].adjVor) : 99;
      const s = PLAYOFF_SOS[p.team];
      let why = [`VOR ${v.adjVor}`, `ADP ${p.adp}`];
      if (need.includes(p.pos)) why.push(`fills ${your} ${p.pos} slot`);
      if (cliff >= 15) why.push(`big drop to the next ${p.pos} (−${cliff.toFixed(0)} VOR)`);
      else if (posLeft <= settings.teams) why.push(`only ${posLeft} startable ${p.pos}s left`);
      if (s && s.rank <= 8) why.push(`sweet playoff schedule (${s.rank}/32)`);
      if (s && s.rank >= 27) why.push(`⚠ rough playoff schedule (${s.rank}/32)`);
      if (p.injury) why.push(`⚠ ${p.injury}`);
      const byeClash = roster.filter(x => x.bye === p.bye && x.pos !== 'K' && x.pos !== 'DST').length;
      if (byeClash >= 2) why.push(`⚠ shares bye ${p.bye} with ${byeClash} of ${your} players`);
      return `${i + 1}. ${pName(p)} — ${why.join(', ')}`;
    });
    const tn = ctx.teamName ? ctx.teamName(ti) : 'Team ' + (ti + 1);
    const head = ctx.draftActive && ti !== ctx.userTeam ? `For <b>${tn}</b> (on the clock):` : `My board says:`;
    return { html: head + li(items) };
  }

  // BEST AVAILABLE AT POSITION (incl. playoff-flavored)
  if (pos && /(best|top|available|left|remaining)/.test(nq) && !/playoff/.test(nq)) {
    const list = avail.filter(p => p.pos === pos).sort((a, b) => values[b.id].adjVor - values[a.id].adjVor).slice(0, 5);
    if (!list.length) return { html: `No ${pos}s left on the board.` };
    return { html: `Best ${pos}s available:` + li(list.map(p => {
      const v = values[p.id];
      return `${pName(p)} — proj ${v.adj}, VOR ${v.adjVor}, ADP ${p.adp}, bye ${p.bye}${p.injury ? `, <span class="inj">${p.injury}</span>` : ''}`;
    })) };
  }

  // PLAYOFF QUESTIONS
  if (/playoff|week 1[5-7]|championship/.test(nq)) {
    if (named.length) {
      const p = named[0];
      const s = PLAYOFF_SOS[p.team];
      if (!s) return { html: `I don't have playoff schedule data for ${p.team}.` };
      const wk = s.w.map((x, i) => `Week ${PLAYOFF_WEEKS[i]}: ${x.opp} — ${favWord(x.fav)} matchup ${favMark(x.fav)}`);
      const summary = s.rank <= 8 ? `That's one of the best playoff schedules in the league (${s.rank}/32) — a real tiebreaker in his favor.`
        : s.rank >= 25 ? `That's one of the toughest playoff runs (${s.rank}/32) — worth a small discount if you're choosing between similar players.`
        : `Middle-of-the-road playoff schedule (${s.rank}/32) — not a deciding factor.`;
      return { html: `${pName(p)} (${p.team}) in the fantasy playoffs:` + li(wk) + summary };
    }
    if (pos) {
      const list = avail.filter(p => p.pos === pos && values[p.id].adjVor > -5)
        .sort((a, b) => values[b.id].adjVor - values[a.id].adjVor).slice(0, 12)
        .sort((a, b) => (PLAYOFF_SOS[a.team] ? PLAYOFF_SOS[a.team].rank : 33) - (PLAYOFF_SOS[b.team] ? PLAYOFF_SOS[b.team].rank : 33))
        .slice(0, 5);
      return { html: `Startable ${pos}s still available with the friendliest week 15–17 schedules:` + li(list.map(p =>
        `${pName(p)} — ${sosLine(p.team)}`)) };
    }
    const ranked = Object.entries(PLAYOFF_SOS).sort((a, b) => a[1].rank - b[1].rank);
    return { html: `Friendliest fantasy-playoff schedules (weeks 15–17): <b>` +
      ranked.slice(0, 6).map(([t, s]) => `${t} (${s.rank})`).join(', ') +
      `</b>.<br>Toughest: <b>` + ranked.slice(-5).map(([t, s]) => `${t} (${s.rank})`).join(', ') +
      `</b>.<br><span class="ptag">Ask about a specific player ("How's Gibbs' playoff schedule?") or position ("best playoff WRs").</span>` };
  }

  // BYE QUESTIONS
  if (/\bbye/.test(nq)) {
    if (named.length && !/my|roster|conflict|overlap/.test(nq)) {
      const p = named[0];
      return { html: `${pName(p)} has his bye in <b>week ${p.bye}</b>.` };
    }
    const wkMatch = nq.match(/(?:week|wk)\s*(\d{1,2})/) || nq.match(/bye\s*(\d{1,2})/);
    if (wkMatch) {
      const wk = +wkMatch[1];
      const list = avail.filter(p => p.bye === wk).sort((a, b) => rankMap[a.id] - rankMap[b.id]).slice(0, 8);
      if (!list.length) return { html: `No available players have a week-${wk} bye.` };
      return { html: `Notable available players on bye in week ${wk}:` + li(list.map(p => pName(p))) };
    }
    // roster bye overlaps
    const roster = ctx.rosterOf(ctx.userTeam);
    if (!roster.length) return { html: `You haven't drafted anyone yet — once you have a roster I'll flag bye-week pileups. (You can also ask "who has bye week 10?")` };
    const byWk = {};
    for (const p of roster) (byWk[p.bye] = byWk[p.bye] || []).push(p);
    const lines = Object.entries(byWk).sort((a, b) => +a[0] - +b[0]).map(([wk, ps]) => {
      const flag = ps.filter(x => x.pos !== 'K' && x.pos !== 'DST').length >= 3 ? ' ⚠ pile-up' : '';
      return `Week ${wk}: ${ps.map(x => x.name).join(', ')}${flag}`;
    });
    return { html: `Your roster by bye week:` + li(lines) };
  }

  // WHEN SHOULD I DRAFT A POSITION / SHOULD I WAIT
  if (pos && /(when|wait|how long|should i)/.test(nq)) {
    const repl = replacementRanks(settings)[pos];
    const startable = avail.filter(p => p.pos === pos && values[p.id].vor > 0).length;
    const top = avail.filter(p => p.pos === pos).sort((a, b) => values[b.id].adjVor - values[a.id].adjVor).slice(0, 3);
    let gap = null;
    if (ctx.draftActive && ctx.pickIndex != null) {
      let n = ctx.pickIndex;
      const total = settings.teams * totalRounds(settings);
      for (let i = ctx.pickIndex + (ctx.onClockTeam === ctx.userTeam ? 1 : 0); i < total; i++) {
        if (pickTeam(i, settings.teams) === ctx.userTeam) { gap = i - ctx.pickIndex; break; }
      }
    }
    const goneByThen = gap != null ? avail.filter(p => p.pos === pos && p.adp <= ctx.pickIndex + gap + 1).length : null;
    const items = [
      `<b>${startable}</b> above-replacement ${pos}s left (replacement level ≈ ${pos}${repl} in your league).`,
      top.length ? `Best remaining: ${top.map(p => p.name).join(', ')}.` : '',
      gap != null ? `Your next pick is in <b>${gap}</b> selections — roughly ${goneByThen} of the remaining ${pos}s go by then at ADP.` : '',
    ].filter(Boolean);
    const verdict = startable > settings.teams * 1.5
      ? `You can afford to wait — the ${pos} pool is deep.`
      : startable > settings.teams * 0.6
        ? `It's getting thin — one more round of waiting is defensible, two is a gamble.`
        : `Don't wait. The startable ${pos}s are nearly gone.`;
    return { html: li(items) + verdict };
  }

  // PLAYER CARD (tell me about X / bare name)
  if (named.length) {
    const p = named[0];
    const v = values[p.id];
    const w = ctx.weights[p.id] || 0;
    const pk = ctx.pickedInfo ? ctx.pickedInfo(p.id) : null;
    const items = [
      `Overall #${rankMap[p.id]} on your board (${p.pos}${p.posRank}), ADP ${p.adp}`,
      `Projected <b>${v.adj}</b> pts in your scoring (VOR ${v.adjVor})${w ? ` — includes your ${w > 0 ? '+' : ''}${Math.round(w * WEIGHT_PCT * 100)}% lean` : ''}`,
      `Bye week ${p.bye}${p.injury ? ` · <span class="inj">status: ${p.injury}</span>` : ''}`,
      p.a25 ? ('2025 actuals: ' + [
        p.a25.payd ? `${p.a25.payd} pass yds, ${p.a25.patd} pass TD` : '',
        p.a25.ruyd ? `${p.a25.ruyd} rush yds, ${p.a25.rutd} rush TD` : '',
        p.a25.rec ? `${p.a25.rec} rec for ${p.a25.reyd} yds, ${p.a25.retd} TD` : '',
      ].filter(Boolean).join(' · '))
        : (p.pos !== 'K' && p.pos !== 'DST' ? 'No meaningful 2025 stats (rookie or missed season)' : ''),
      sosLine(p.team) || 'No playoff schedule data',
      pk ? `Drafted: pick ${pk.label}` : (ctx.draftActive ? 'Still on the board' : ''),
    ].filter(Boolean);
    return { html: `${pName(p)}:` + li(items) };
  }

  if (pos) { // bare position
    const list = avail.filter(p => p.pos === pos).sort((a, b) => values[b.id].adjVor - values[a.id].adjVor).slice(0, 5);
    return { html: `Top available ${pos}s:` + li(list.map(p => `${pName(p)} — VOR ${values[p.id].adjVor}, ADP ${p.adp}`)) };
  }

  return { html: `I didn't catch that. Try “who should I take?”, “best RBs left”, “Gibbs or Bijan?”, “bye conflicts”, or “best playoff WRs”. Type <b>help</b> for the full list.` };
}


</script>
<script>
// ===== UI layer (DOM). Depends on core.js + assistant.js + PLAYER_DATA + PLAYOFF_SOS. =====
'use strict';

/* ---------- state ---------- */
const state = {
  tab: 'board',             // 'board' | 'draft' | 'grid'
  settings: defaultSettings(),
  weights: {},              // playerId -> -5..+5
  values: null,             // id -> {proj, adj, vor, adjVor}
  rankMap: {},              // id -> my overall rank (adjVor desc)
  sort: { key: 'myrank', dir: 1 },
  availSort: { key: 'vor', dir: 1 },   // Best Available panel sort (Draft Room / Grid View)
  posFilter: 'ALL',
  search: '',
  hideDrafted: false,
  showSettings: false,
  draft: null,              // see startDraft()
  rosterView: null,         // team index being viewed
  lastSync: null,
  syncing: false,
  confirmReset: false,
  setupMode: 'manual',
  setupSpeed: 600,
  assistOpen: false,
  assistDraft: '',
  focusAssist: false,
  chat: [],
  layout: { mode: 'side', split: 52, stackPx: 420, gridPx: null, sideGridPx: null, recsCollapsed: false, showStats: false }, // panes + prefs
  focusAvail: false,
  teamNames: {},            // teamIdx -> custom name
  showTeamNames: false,
  showWriteIn: false,
  recapOpen: {},            // teamIdx -> lineup expanded in the draft recap
  queue: [],                // saved player ids, in the user's own order (local, never synced)
};
const players = PLAYER_DATA; // mutated in place by Sleeper sync (team/bye/injury)

/* ---------- live mode (served from server.js) ---------- */
const LIVE = location.protocol === 'http:' || location.protocol === 'https:';
const COMMISH_KEY = LIVE ? new URLSearchParams(location.search).get('key') : null;
const IS_VIEWER = LIVE && !COMMISH_KEY;
state.liveStatus = LIVE ? 'connecting…' : null;
state.viewerCount = null;

// actions a viewer may NOT perform (everything local — sort/filter/search/
// leans/layout/assistant — stays allowed)
const VIEWER_BLOCKED = new Set(['start', 'setupmode', 'pause', 'resume', 'undo', 'draft', 'pickforme',
  'reset', 'writein', 'writeinadd', 'writeindraft', 'teamnames', 'clearteams', 'preset', 'sync', 'import']);

function syncPayload() {
  const d = state.draft;
  return {
    settings: state.settings,
    teamNames: state.teamNames,
    custom: players.filter(p => p.isCustom),
    rosterPatch: players.map(p => [p.id, p.team, p.bye, p.injury || 0, p.adp, p.posRank]),
    statsPatch: players.filter(p => p._live).map(p => [p.id, p.stats]),
    draft: d ? { mode: d.mode, picks: d.picks } : null,
  };
}
let _lastPushed = '', _pushTimer = null;
function schedulePush() {
  if (!LIVE || IS_VIEWER) return;
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(() => {
    const json = JSON.stringify(syncPayload());
    if (json === _lastPushed) return;
    _lastPushed = json;
    fetch('/state?key=' + encodeURIComponent(COMMISH_KEY), { method: 'POST', body: json })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => {
        state.liveStatus = 'live';
        if (j.viewers !== state.viewerCount) { state.viewerCount = j.viewers; renderHeader(); }
      })
      .catch(() => { state.liveStatus = 'offline'; renderHeader(); });
  }, 150);
}
function applyRemote(s) {
  if (!s) { render(); return; }
  const base = defaultSettings();
  state.settings = { ...base, ...s.settings, scoring: { ...base.scoring, ...(s.settings || {}).scoring }, roster: { ...base.roster, ...(s.settings || {}).roster } };
  state.teamNames = s.teamNames || {};
  for (let i = players.length - 1; i >= 0; i--) if (players[i].isCustom) players.splice(i, 1);
  for (const cp of (s.custom || [])) players.push(cp);
  if (s.rosterPatch) {
    const byId = {};
    players.forEach(p => byId[p.id] = p);
    for (const [id, team, bye, inj, adp, posRank] of s.rosterPatch) {
      const p = byId[id];
      if (p) {
        p.team = team; p.bye = bye; p.injury = inj || null;
        if (adp) p.adp = adp;
        if (posRank) p.posRank = posRank;
      }
    }
    if (s.statsPatch) {
      for (const [id, stats] of s.statsPatch) { if (byId[id]) byId[id].stats = stats; }
    }
  }
  state.draft = s.draft ? { mode: s.draft.mode, picks: s.draft.picks, paused: false, timer: null } : null;
  if (state.draft && state.rosterView == null) state.rosterView = state.settings.userSlot - 1;
  recompute();
  render();
}
function startLive() {
  if (!LIVE) return;
  if (IS_VIEWER) {
    const es = new EventSource('/events');
    es.onmessage = e => {
      state.liveStatus = 'live';
      try { applyRemote(JSON.parse(e.data).state); } catch (err) { render(); }
    };
    es.onerror = () => { state.liveStatus = 'reconnecting…'; renderHeader(); };
  } else {
    // commissioner: adopt any state already on the server (survives a reload)
    fetch('/state').then(r => r.json()).then(j => {
      if (j.state) { applyRemote(j.state); _lastPushed = JSON.stringify(syncPayload()); }
      state.liveStatus = 'live';
      render();
    }).catch(() => { state.liveStatus = 'offline'; renderHeader(); });
  }
}

function recompute() {
  state.values = computeValues(players, state.settings, state.weights);
  const order = players.slice().sort((a, b) => state.values[b.id].adjVor - state.values[a.id].adjVor);
  state.rankMap = {};
  order.forEach((p, i) => state.rankMap[p.id] = i + 1);
}
recompute();

/* ---------- helpers ---------- */
const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(msg, ms) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms || 2600);
}
function fmt1(x) { return (Math.round(x * 10) / 10).toFixed(1); }
function teamName(i) {
  if (state.teamNames[i]) return state.teamNames[i];
  if (IS_VIEWER) return 'Team ' + (i + 1); // "You" would mean the commissioner
  return i === state.settings.userSlot - 1 ? 'You' : 'Team ' + (i + 1);
}
function customTag(p) { return p.isCustom ? ' <span class="customtag" title="Write-in player">✎</span>' : ''; }
function queueBtn(p) {
  const saved = state.queue.includes(p.id);
  return `<button class="qbtn ${saved ? 'on' : ''}" data-action="qtoggle" data-id="${p.id}" title="${saved ? 'Remove from' : 'Save to'} your queue">${saved ? '★' : '☆'}</button>`;
}
function toggleQueue(id) {
  const i = state.queue.indexOf(id);
  if (i === -1) state.queue.push(id); else state.queue.splice(i, 1);
  render();
}
function injTag(p) {
  if (!p.injury) return '';
  const short = { 'Questionable': 'Q', 'Doubtful': 'D', 'Out': 'O', 'IR': 'IR', 'PUP': 'PUP', 'Sus': 'SUS', 'NA': 'NA' }[p.injury] || p.injury;
  return `<span class="inj" title="${esc(p.injury)}">${esc(short)}</span>`;
}
function weightPct(w) { return (w > 0 ? '+' : '') + Math.round(w * WEIGHT_PCT * 100) + '%'; }

/* ---------- draft accessors ---------- */
function draftedIds() { return state.draft ? new Set(state.draft.picks) : new Set(); }
function availablePlayers() {
  const gone = draftedIds();
  return players.filter(p => !gone.has(p.id));
}
function teamRoster(ti) {
  const d = state.draft; if (!d) return [];
  const out = [];
  d.picks.forEach((pid, i) => {
    if (pickTeam(i, state.settings.teams) === ti) out.push(players.find(p => p.id === pid));
  });
  return out;
}
function pickedInfo(pid) {
  const d = state.draft; if (!d) return null;
  const i = d.picks.indexOf(pid);
  if (i === -1) return null;
  return { label: pickLabel(i, state.settings.teams), team: pickTeam(i, state.settings.teams) };
}
function currentPickIndex() { return state.draft.picks.length; }
function draftDone() {
  const total = state.settings.teams * totalRounds(state.settings);
  return state.draft.picks.length >= total || availablePlayers().length === 0;
}
function isUserTurn() {
  const d = state.draft;
  if (IS_VIEWER) return false; // viewers never draft
  if (!d || draftDone()) return false;
  if (d.mode === 'commish') return true; // you make every pick
  return d.mode === 'manual' &&
    pickTeam(currentPickIndex(), state.settings.teams) === state.settings.userSlot - 1;
}
function onClockTeam() {
  return state.draft && !draftDone() ? pickTeam(currentPickIndex(), state.settings.teams) : null;
}

/* ---------- draft engine ---------- */
function startDraft(mode) {
  const need = state.settings.teams * totalRounds(state.settings);
  if (need > players.length) {
    toast(`This setup needs ${need} picks but the board has ${players.length} players — trim bench/teams in Settings.`, 4200);
    return;
  }
  state.draft = { mode, speed: state.setupSpeed, picks: [], timer: null, paused: false };
  state.rosterView = state.settings.userSlot - 1;
  if (state.tab !== 'grid') state.tab = 'draft';
  loop();
}
function stopTimer() { if (state.draft && state.draft.timer) { clearTimeout(state.draft.timer); state.draft.timer = null; } }
function loop() {
  const d = state.draft; if (!d) return;
  stopTimer();
  if (draftDone()) {
    d.paused = false;
    if (!d.recapInit) { d.recapInit = true; state.recapOpen = { [state.settings.userSlot - 1]: true }; } // open your lineup first
    render(); return;
  }
  if (d.mode === 'commish') { render(); return; } // no AI, no timers — you pick everything
  if (d.paused) { render(); return; }
  if (isUserTurn()) { render(); return; }
  render();
  d.timer = setTimeout(() => {
    aiPickNow();
    loop();
  }, d.mode === 'manual' ? Math.min(d.speed, 350) : d.speed);
}
function aiPickNow() {
  const d = state.draft;
  const pi = currentPickIndex();
  const ti = pickTeam(pi, state.settings.teams);
  const sel = aiSelect(availablePlayers(), teamRoster(ti), state.settings, state.values, pi);
  if (sel) d.picks.push(sel.id);

/* ---------- Sleeper sync ---------- */
const INJ_MAP = { 'Questionable': 'Questionable', 'Doubtful': 'Doubtful', 'Out': 'Out', 'IR': 'IR', 'PUP': 'PUP', 'Sus': 'Sus', 'COV': 'Out', 'NA': 'NA' };
function nrmName(n) {
  return n.toLowerCase().replace(/[.,'\-]/g, '').replace(/\s+(jr|sr|ii|iii|iv|v)$/, '').replace(/\s+/g, ' ').trim();
}
// Sleeper projected-stat key → our stat field (only applied when present)
const PROJ_MAP = {
  pass_yd: 'payd', pass_td: 'patd', pass_int: 'int',
  rush_att: 'ruatt', rush_yd: 'ruyd', rush_td: 'rutd',
  rec: 'rec', rec_yd: 'reyd', rec_td: 'retd', fum_lost: 'fum',
  fgm_0_19: 'fg019', fgm_20_29: 'fg2029', fgm_30_39: 'fg3039',
  fgm_40_49: 'fg4049', fgm_50p: 'fg50', fgm: 'fg', xpm: 'xp',
  sack: 'sacks', int: 'dint', fum_rec: 'fumrec', def_td: 'dtd',
};
const OFFENSE_KEYS = ['pass_yd', 'pass_td', 'pass_int', 'rush_att', 'rush_yd', 'rush_td', 'rec', 'rec_yd', 'rec_td', 'fum_lost'];
async function syncSleeper() {
  if (state.syncing) return;
  state.syncing = true; render();
  let matched = 0, moved = 0, inj = 0, projN = 0, adpN = 0;
  let ok1 = false, ok2 = false;
  // 1) rosters & injuries (official endpoint)
  try {
    const resp = await fetch('https://api.sleeper.app/v1/players/nfl');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const all = await resp.json();
    const idx = {};
    for (const k in all) {
      const sp = all[k];
      if (!sp.full_name || !sp.position) continue;
      idx[nrmName(sp.full_name) + '|' + sp.position] = sp;
    }
    for (const p of players) {
      if (p.pos === 'DST') continue;
      const sp = idx[nrmName(p.name) + '|' + p.pos];
      if (!sp) continue;
      matched++;
      p.sid = sp.player_id;
      if (sp.team && sp.team !== p.team) {
        p.team = sp.team;
        p.bye = TEAM_BYES[sp.team] || p.bye;
        moved++;
      }
      const tag = sp.injury_status ? (INJ_MAP[sp.injury_status] || sp.injury_status) : null;
      if (tag !== p.injury) { p.injury = tag; }
      if (tag) inj++;
    }
    ok1 = true;
  } catch (e) { /* fall through — try projections anyway */ }
  // 2) current projections + ADP (endpoint Sleeper's own app uses)
  try {
    const season = new Date().getFullYear();
    const url = `https://api.sleeper.com/projections/nfl/${season}?season_type=regular` +
      ['QB', 'RB', 'WR', 'TE', 'K', 'DEF'].map(x => '&position[]=' + x).join('') + '&order_by=adp_half_ppr';
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const rows = await resp.json();
    const bySid = {}, byName = {};
    for (const r of rows) {
      if (!r || !r.stats) continue;
      bySid[r.player_id] = r;
      if (r.player && r.player.last_name) {
        byName[nrmName((r.player.first_name || '') + ' ' + r.player.last_name) + '|' + (r.player.position === 'DEF' ? 'DST' : r.player.position)] = r;
      }
    }
    const rec = state.settings.scoring.rec;
    const adpKey = rec >= 1 ? 'adp_ppr' : rec > 0 ? 'adp_half_ppr' : 'adp_std';
    for (const p of players) {
      const r = (p.sid && bySid[p.sid]) || (p.pos === 'DST' ? bySid[p.team] : byName[nrmName(p.name) + '|' + p.pos]);
      if (!r) continue;
      const s = r.stats;
      // ADP (999 = undrafted in Sleeper)
      const adp = s[adpKey] || s.adp_half_ppr || s.adp_ppr || s.adp_std;
      if (adp && adp > 0 && adp < 600) { p.adp = Math.round(adp * 10) / 10; adpN++; }
      // projected stat lines: overwrite only the fields Sleeper provides
      let touched = false;
      const keys = p.pos === 'K' ? ['fgm_0_19', 'fgm_20_29', 'fgm_30_39', 'fgm_40_49', 'fgm_50p', 'fgm', 'xpm']
        : p.pos === 'DST' ? ['sack', 'int', 'fum_rec', 'def_td']
        : OFFENSE_KEYS;
      for (const k of keys) {
        if (s[k] != null && PROJ_MAP[k]) { p.stats[PROJ_MAP[k]] = Math.round(s[k] * 10) / 10; touched = true; }
      }
      if (touched) { p._live = true; projN++; }
    }
    // refresh positional ranks to the new ADP order
    for (const pos of ['QB', 'RB', 'WR', 'TE', 'K', 'DST']) {
      players.filter(p => p.pos === pos).sort((a, b) => a.adp - b.adp).forEach((p, i) => p.posRank = i + 1);
    }
    ok2 = true;
  } catch (e) { /* reported below */ }
  if (ok1 || ok2) {
    state.lastSync = new Date().toLocaleTimeString();
    toast(`Sleeper sync: ${matched} matched · ${moved} team changes · ${inj} injury tags · ${projN} projections + ${adpN} ADP updated${ok2 ? '' : ' (projections feed unavailable)'}`, 5000);
  } else {
    toast('Sleeper sync failed (offline or blocked)', 4000);
  }
  state.syncing = false;
  recompute();
  render();
}

/* ---------- export / import ---------- */
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'application/json' }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
function exportProfile() {
  download('draft-lab-profile.json', JSON.stringify({ v: 1, settings: state.settings, weights: state.weights, layout: state.layout, teamNames: state.teamNames, customPlayers: players.filter(p => p.isCustom), queue: state.queue }, null, 2));
  toast('Profile exported — import it next session to restore settings + leans');
}
function importProfile(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (j.settings) state.settings = { ...defaultSettings(), ...j.settings, scoring: { ...defaultSettings().scoring, ...j.settings.scoring }, roster: { ...defaultSettings().roster, ...j.settings.roster } };
      if (j.weights) state.weights = j.weights;
      if (j.layout) state.layout = { ...state.layout, ...j.layout };
      if (j.teamNames) state.teamNames = j.teamNames;
      if (Array.isArray(j.queue)) state.queue = j.queue;
      if (Array.isArray(j.customPlayers)) {
        for (const cp of j.customPlayers) {
          if (!players.find(p => nrmName(p.name) === nrmName(cp.name))) {
            cp.id = Math.max(...players.map(p => p.id)) + 1;
            players.push(cp);
          }
        }
      }
      recompute(); render();
      toast('Profile imported');
    } catch (e) { toast('Import failed: not a valid profile file'); }
  };
  r.readAsText(file);
}
function exportDraftCSV() {

// shared comparator for board + best-available sorting
function boardCmp(key) {
  const vals = state.values;
  const S = {
    pPay: p => p.stats.payd || 0, pRuy: p => p.stats.ruyd || 0, pRey: p => p.stats.reyd || 0,
    pRec: p => p.stats.rec || 0, pTd: p => (p.stats.patd || 0) + (p.stats.rutd || 0) + (p.stats.retd || 0),
    aPay: p => p.a25 ? (p.a25.payd || 0) : -1, aRuy: p => p.a25 ? (p.a25.ruyd || 0) : -1,
    aRey: p => p.a25 ? (p.a25.reyd || 0) : -1, aRec: p => p.a25 ? (p.a25.rec || 0) : -1,
    aTd: p => p.a25 ? (p.a25.patd || 0) + (p.a25.rutd || 0) + (p.a25.retd || 0) : -1,
  };
  return {
    myrank: (a, b) => state.rankMap[a.id] - state.rankMap[b.id],
    name: (a, b) => a.name.localeCompare(b.name),
    pos: (a, b) => a.pos.localeCompare(b.pos) || state.rankMap[a.id] - state.rankMap[b.id],
    adp: (a, b) => a.adp - b.adp,
    proj: (a, b) => vals[b.id].adj - vals[a.id].adj,
    vor: (a, b) => vals[b.id].adjVor - vals[a.id].adjVor,
    ...Object.fromEntries(Object.entries(S).map(([k, f]) => [k, (a, b) => f(b) - f(a)])),
  }[key] || ((a, b) => 0);
}

function sortedBoard() {
  const { key, dir } = state.sort;
  let list = players.slice();
  if (state.posFilter !== 'ALL') {
    if (state.posFilter === 'FLEX') list = list.filter(p => p.pos === 'RB' || p.pos === 'WR' || p.pos === 'TE');
    else list = list.filter(p => p.pos === state.posFilter);
  }
  if (state.search) {
    const q = state.search.toLowerCase();
    list = list.filter(p => p.name.toLowerCase().includes(q) || p.team.toLowerCase().includes(q));
  }
  if (state.hideDrafted && state.draft) {
    const gone = draftedIds();
    list = list.filter(p => !gone.has(p.id));
  }
  const cmp = boardCmp(key);
  list.sort((a, b) => dir * cmp(a, b));
  return list;
}
const STAT_COLS = [
  ['pPay', 'Pass Yd', p => p.stats.payd, 0], ['pRuy', 'Rush Yd', p => p.stats.ruyd, 0],
  ['pRey', 'Rec Yd', p => p.stats.reyd, 0], ['pRec', 'Rec', p => p.stats.rec, 1],
  ['pTd', 'TD', p => (p.stats.patd || 0) + (p.stats.rutd || 0) + (p.stats.retd || 0), 1],
  ['aPay', 'Pass Yd', p => p.a25 && p.a25.payd, 0], ['aRuy', 'Rush Yd', p => p.a25 && p.a25.ruyd, 0],
  ['aRey', 'Rec Yd', p => p.a25 && p.a25.reyd, 0], ['aRec', 'Rec', p => p.a25 && p.a25.rec, 0],
  ['aTd', 'TD', p => p.a25 ? (p.a25.patd || 0) + (p.a25.rutd || 0) + (p.a25.retd || 0) : null, 0],
];
function statCell(p, f, dec) {

  return `<td class="mono statcol">${dec ? (Math.round(v * 10) / 10) : Math.round(v)}</td>`;
}

/* ----- draft room building blocks ----- */
function draftPieces() {
  const d = state.draft;
  const T = state.settings.teams;
  const total = T * totalRounds(state.settings);
  const done = draftDone();
  const pi = currentPickIndex();
  const ti = done ? -1 : pickTeam(pi, T);
  const userTurn = isUserTurn();
  const avail = availablePlayers();

  let statusHtml;
  if (done) statusHtml = `<span class="onclock">🏁 Draft complete</span>`;
  else statusHtml = `<span class="pickchip mono">Pick ${pi + 1}/${total} · ${pickLabel(pi, T)}</span>
    <span class="onclock ${ti === state.settings.userSlot - 1 ? 'you' : ''}">${esc(teamName(ti))} on the clock${
      IS_VIEWER ? '' : d.mode === 'commish' ? ' — <span class="muted" style="font-weight:400">you pick for everyone</span>' : (userTurn ? ' — your pick!' : '')}</span>`;

  const L = state.layout;
  const layoutChips = `<span class="chips" title="Layout">
    <button class="chip ${state.tab === 'draft' && L.mode === 'side' ? 'on' : ''}" data-action="layout" data-m="side" title="Side by side (drag the divider to resize)">◫ Side</button>
    <button class="chip ${state.tab === 'draft' && L.mode === 'stack' ? 'on' : ''}" data-action="layout" data-m="stack" title="Stacked: grid on top, players below">⬒ Stacked</button>
    <button class="chip ${state.tab === 'grid' ? 'on' : ''}" data-action="tab" data-tab="grid" title="Maximized draft grid page">⛶ Grid view</button>
  </span>`;

  const controls = `
    ${!done && d.mode === 'auto' ? (d.paused
      ? `<button class="btn primary" data-action="resume">▶ Resume</button>`
      : `<button class="btn" data-action="pause">⏸ Pause</button>`) : ''}
    ${!done && d.mode === 'manual' && d.paused ? `<button class="btn primary" data-action="resume">▶ Resume</button>` : ''}
    ${userTurn ? `<button class="btn primary" data-action="pickforme">⚡ Pick for me</button>` : ''}
    <button class="btn" data-action="undo" ${d.picks.length ? '' : 'disabled'}>↩ Undo</button>
    <button class="btn" data-action="exportcsv" ${d.picks.length ? '' : 'disabled'}>⬇ CSV</button>
    <button class="btn danger" data-action="reset">${state.confirmReset ? 'Confirm reset?' : '✕ Reset draft'}</button>`;

  const bar = IS_VIEWER
    ? `<div class="draftbar">${statusHtml}<span style="margin-left:auto"></span>${layoutChips}
       <button class="btn" data-action="exportcsv" ${d.picks.length ? '' : 'disabled'}>⬇ CSV</button></div>`
    : `<div class="draftbar">${statusHtml}<span style="margin-left:auto"></span>${layoutChips}
    <button class="btn" data-action="writein" title="Add a player who isn't on the board">➕ Write-in</button>
    <button class="btn" data-action="teamnames" title="Rename the teams">✎ Teams</button>${controls}</div>`;

  // recommendations for whoever is on the clock (you, or the team you're running)
  let recsHtml = '';
  if (userTurn) {
    const recTeam = d.mode === 'commish' ? ti : state.settings.userSlot - 1;
    const recs = recommend(avail, teamRoster(recTeam), state.settings, state.values, 5);
    const recLabel = d.mode === 'commish' && recTeam !== state.settings.userSlot - 1
      ? `RECOMMENDED FOR ${esc(teamName(recTeam)).toUpperCase()} (your ranks + their needs)`
      : 'RECOMMENDED FOR YOU (your ranks + roster needs)';
    const collapsed = state.layout.recsCollapsed;
    const body = collapsed ? '' : recs.map(p => {
      const v = state.values[p.id];
      return `<div class="recrow">
        <button class="btn small primary" data-action="draft" data-id="${p.id}">Draft</button>
        <span class="pos ${p.pos}">${p.pos}</span>
        <b>${esc(p.name)}</b>${injTag(p)} <span class="ptag">${p.team}</span>
        <span class="why mono">Proj ${fmt1(v.adj)} · VOR ${fmt1(v.adjVor)} · ADP ${p.adp}</span>
      </div>`;
    }).join('');
    recsHtml = `<div class="recs${collapsed ? ' collapsed' : ''}">
      <div class="recshead" data-action="togglerecs" title="${collapsed ? 'Expand' : 'Collapse'} recommendations">
        <b style="font-size:12px;letter-spacing:.5px;color:var(--accent2)">${recLabel}</b>
        ${collapsed ? `<span class="ptag" style="margin-left:8px">${recs.length ? 'top: ' + esc(recs[0].name) : ''}</span>` : ''}
        <span class="rectoggle">${collapsed ? '▸' : '▾'}</span>
      </div>${body}</div>`;
  }

  // available list (respecting pos filter), sorted by user's adjusted VOR
  function availPanel(rowCount, maxH, fitBottom) {
    let alist = avail;
    if (state.posFilter !== 'ALL') {
      if (state.posFilter === 'FLEX') alist = alist.filter(p => ['RB', 'WR', 'TE'].includes(p.pos));
      else alist = alist.filter(p => p.pos === state.posFilter);
    }
    if (state.search) {
      const q = state.search.toLowerCase();
      alist = alist.filter(p => p.name.toLowerCase().includes(q) || p.team.toLowerCase().includes(q));
    }
    const as = state.availSort;
    const acmp = boardCmp(as.key);
    alist = alist.slice().sort((a, b) => as.dir * acmp(a, b)).slice(0, rowCount);
    const showStats = state.layout.showStats;
    const aArrow = k => as.key === k ? `<span class="arr">${as.dir === 1 ? '▲' : '▼'}</span>` : '';
    const ath = (k, label, title) => `<th data-action="asort" data-k="${k}" ${title ? `title="${title}"` : ''}>${label}${aArrow(k)}</th>`;
    const rows = alist.map(p => {
      const v = state.values[p.id];
      return `<tr>
        <td class="mono muted">${state.rankMap[p.id]}</td>
        <td><span class="pname">${esc(p.name)}</span>${customTag(p)}${injTag(p)} <span class="ptag">${p.team} · Bye ${p.bye}</span></td>
        <td><span class="pos ${p.pos}">${p.pos}</span></td>
        <td class="mono">${p.adp}</td>
        <td class="mono">${fmt1(v.adj)}</td>
        <td class="mono ${v.adjVor >= 0 ? 'vorpos' : 'vorneg'}">${fmt1(v.adjVor)}</td>
        ${showStats ? STAT_COLS.map(([k, lbl, f, dec]) => statCell(p, f, dec)).join('') : ''}
        <td>${queueBtn(p)}${userTurn ? ` <button class="btn small primary" data-action="draft" data-id="${p.id}">Draft</button>` : ''}</td>
      </tr>`;
    }).join('');
    return `<div class="panel">
      <div class="phead">Best available <span class="muted" style="font-weight:400">· your adjusted VOR</span>
        <input id="availSearch" type="search" placeholder="Search…" value="${esc(state.search)}" style="width:150px;margin-left:auto;font-size:12.5px;padding:3px 8px">
        <button class="chip ${showStats ? 'on' : ''}" data-action="togglestats" title="Show projected + 2025 actual stat columns">📊 Stats</button>
        <span class="chips">${['ALL', 'QB', 'RB', 'WR', 'TE', 'FLEX', 'K', 'DST'].map(f =>
          `<button class="chip ${state.posFilter === f ? 'on' : ''}" data-action="filter" data-f="${f}">${f}</button>`).join('')}</span>
      </div>
      ${recsHtml}
      <div class="gridwrap ${fitBottom ? 'fitbottom' : ''}" style="${maxH ? `max-height:${maxH}` : ''}"><table class="avail-table">
        <thead>
        ${showStats ? `<tr class="grouprow">
          <th class="nosort" colspan="6"></th>
          <th class="nosort group proj" colspan="5">2026 Projected</th>
          <th class="nosort group act" colspan="5">2025 Actual</th>
          <th class="nosort"></th>
        </tr>` : ''}
        <tr class="${showStats ? 'sub' : ''}">${ath('myrank', '#', 'Your overall rank')}${ath('name', 'Player')}${ath('pos', 'Pos')}${ath('adp', 'ADP')}${ath('proj', 'Proj')}${ath('vor', 'VOR')}
          ${showStats ? STAT_COLS.map(([k, lbl]) => `<th class="statcol" data-action="asort" data-k="${k}">${lbl}${aArrow(k)}</th>`).join('') : ''}
          <th class="nosort"></th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>`;
  }

  // draft grid
  function gridTable(big) {
    const rounds = totalRounds(state.settings);
    let grid = `<table class="dgrid${big ? ' big' : ''}"><tr><th></th>`;
    for (let t = 0; t < T; t++) grid += `<th class="${t === state.settings.userSlot - 1 ? 'usercol' : ''}">${esc(teamName(t))}</th>`;
    grid += '</tr>';
    for (let r = 0; r < rounds; r++) {
      grid += `<tr><td class="rd">${r + 1}</td>`;
      for (let t = 0; t < T; t++) {
        const withinRound = r % 2 === 0 ? t : T - 1 - t;
        const pIdx = r * T + withinRound;
        const pid = d.picks[pIdx];
        const p = pid ? players.find(x => x.id === pid) : null;
        grid += `<td class="${t === state.settings.userSlot - 1 ? 'usercol' : ''}">` +
          (p ? `<span class="cellp ${p.pos}"><span class="nm">${esc(p.name)}</span><span class="ptag">${p.pos} · ${p.team}</span></span>`
             : (pIdx === pi && !done ? '<span class="muted">⏱ …</span>' : '')) + '</td>';
      }
      grid += '</tr>';
    }
    return grid + '</table>';
  }
  function gridPanel(opts) {
    opts = opts || {};
    const style = opts.height ? `height:${opts.height}px;max-height:none` : '';
    return `<div class="panel">
      <div class="phead">Draft board
        ${state.tab === 'draft' ? `<button class="btn small" data-action="tab" data-tab="grid" style="margin-left:auto" title="Open maximized grid page">⛶ Maximize</button>` : ''}
      </div>
      <div class="gridwrap ${!opts.height && opts.fit ? 'fitbottom' : ''}" id="${opts.id || 'gridWrap'}" style="${style}">${gridTable(!!opts.big)}</div>
    </div>`;
  }

  // roster viewer
  const rv = state.rosterView == null ? state.settings.userSlot - 1 : state.rosterView;
  const slots = assignSlots(state.settings.roster, teamRoster(rv));
  const rosterHtml = slots.length
    ? slots.map(s => `<div class="rrow"><span class="slot">${s.slot}</span><span class="pos ${s.p.pos}">${s.p.pos}</span> <b>${esc(s.p.name)}</b> <span class="ptag">${s.p.team} · Bye ${s.p.bye} · ${fmt1(state.values[s.p.id].proj)} pts</span></div>`).join('')
    : '<div class="muted" style="padding:6px 0">No picks yet.</div>';
  const rosterPanel = `<div class="panel">
    <div class="phead">Roster
      <select data-action="rosterview" style="margin-left:auto">${Array.from({ length: T }, (_, t) =>
        `<option value="${t}" ${t === rv ? 'selected' : ''}>${esc(teamName(t))}</option>`).join('')}</select>
    </div>
    <div class="rosterlist">${rosterHtml}</div>
  </div>`;

  const log = d.picks.slice(-14).map((pid, j) => {
    const i = d.picks.length - Math.min(14, d.picks.length) + j;
    const p = players.find(x => x.id === pid);
    return `<div><span class="mono muted">${pickLabel(i, T)}</span> <b>${esc(teamName(pickTeam(i, T)))}</b> → <span class="pos ${p.pos}">${p.pos}</span> ${esc(p.name)}</div>`;
  }).reverse().join('');
  const logPanel = `<div class="panel"><div class="phead">Pick log</div><div class="log">${log || '<span class="muted">—</span>'}</div></div>`;

  // recap when done: ranked totals, each row expandable to the starting lineup
  let recap = '';
  if (done) {
    const scores = [];
    for (let t = 0; t < T; t++) {
      const all = assignSlots(state.settings.roster, teamRoster(t));
      const starters = all.filter(s => s.slot !== 'BN');
      scores.push({ t, starters, bench: all.filter(s => s.slot === 'BN'), pts: starters.reduce((a, s) => a + state.values[s.p.id].proj, 0) });
    }
    scores.sort((a, b) => b.pts - a.pts);
    recap = `<div class="panel" style="margin-bottom:12px"><div class="phead">📊 Projected starter points (draft recap) <span class="muted" style="font-weight:400;font-size:12px">· click a team to see the lineup</span></div><div class="rosterlist">` +
      scores.map((s, i) => {
        const open = !!state.recapOpen[s.t];
        const you = s.t === state.settings.userSlot - 1;
        let row = `<div class="rrow recaprow" data-action="recapteam" data-t="${s.t}" title="${open ? 'Hide' : 'Show'} lineup">
          <span class="slot mono">#${i + 1}</span>
          <b style="${you ? 'color:var(--accent2)' : ''}">${esc(teamName(s.t))}</b>
          <span class="ptag mono" style="margin-left:auto">${fmt1(s.pts)} proj pts</span>
          <span class="rectoggle">${open ? '▾' : '▸'}</span>
        </div>`;
        if (open) {
          row += `<div class="recaplineup">` +
            s.starters.map(x => `<div class="rrow"><span class="slot">${x.slot}</span><span class="pos ${x.p.pos}">${x.p.pos}</span> <b>${esc(x.p.name)}</b>${customTag(x.p)} <span class="ptag">${x.p.team} · Bye ${x.p.bye}</span><span class="ptag mono" style="margin-left:auto">${fmt1(state.values[x.p.id].proj)}</span></div>`).join('') +
            (s.bench.length ? `<div class="rrow"><span class="slot">BN</span><span class="ptag">${s.bench.map(x => esc(x.p.name)).join(' · ')}</span></div>` : '') +
            `</div>`;
        }
        return row;
      }).join('') +
      `</div></div>`;
  }

  return { bar, recap, availPanel, gridPanel, rosterPanel, logPanel };
}

}

      ${showStats ? STAT_COLS.map(([k, lbl, f, dec]) => statCell(p, f, dec)).join('') : ''}
      <td><span class="wctl">
        <button class="wbtn" data-action="w-" data-id="${p.id}" title="More bearish">−</button>
        <span class="wval ${w > 0 ? 'up' : w < 0 ? 'down' : 'zero'}" data-action="w0" data-id="${p.id}">${w > 0 ? '+' + w : w}</span>
        <button class="wbtn" data-action="w+" data-id="${p.id}" title="More bullish">+</button>
      </span></td>

        <button class="wbtn" data-action="qup" data-id="${p.id}" title="Move up" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button class="wbtn" data-action="qdown" data-id="${p.id}" title="Move down" ${i === ids.length - 1 ? 'disabled' : ''}>↓</button>

    <button class="chip ${showStats ? 'on' : ''}" data-action="togglestats" title="Show projected + 2025 actual stat columns">📊 Stats</button>
    ${state.draft ? `<label style="display:flex;gap:6px;align-items:center;font-size:12.5px" class="muted"><input type="checkbox" id="hideDrafted" ${state.hideDrafted ? 'checked' : ''}> hide drafted</label>` : ''}
    ${total ? `<button class="btn small" data-action="clearqueue" style="margin-left:auto">Clear queue</button>` : ''}
  </div>
  ${total === 0
    ? `<div class="setupcard" style="text-align:center"><h2>Nothing saved yet</h2>
       <p class="muted" style="margin:12px 0">Hit the ☆ next to any player on the <a href="#" data-action="tab" data-tab="board" style="color:var(--accent)">Player Board</a> or the Best Available list to build a private watch list for your draft.</p></div>`
    : `<div class="tablewrap">
    <table>

        <th class="nosort">Proj</th><th class="nosort">VOR</th>
        ${showStats ? STAT_COLS.map(([k, lbl]) => `<th class="nosort statcol">${lbl}</th>`).join('') : ''}
